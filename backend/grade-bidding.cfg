; Graded openings (grading.cl): one entry ((bid) . rule) per bid, nil for
; pass. The highest grade wins, the earlier bid on a tie. Grade expressions
; are described at the top of grading.cl. The debugger (grading.html) saves
; a rule edited there in place of its text here, keeping the rest of the file.
;
; A rule is (* hcp lengths (and losers suit-points)): HCP ranges and suit
; lengths multiply, so missing one is near-fatal; losers and suit points
; are averaged. One-level openings allow 10-11 HCP, not less: below 12 they
; lose 0.35 a point (11: 0.65, 10: 0.3, 9: 0).

; 2♣: 23+ HCP, or unbalanced with 5-5 or a good long suit (7+ cards, or 6
; with 8+ points in it): with a major in it 4 losers or fewer, with minors
; only 3 or fewer
((2 C) . (or (=~ hcp (23 nil) 0.5)
             (* (not balanced)
                (or (* (=~ losers (nil 4) 1)
                       (or (* (or (=~ H (5 nil) 1) (=~ S (5 nil) 1)) (=~ second (5 nil) 0.7))
                           (=~ H (7 nil) 0.7) (* (=~ H (6 nil) 0.7) (=~ Hpower (8 nil) 0.3))
                           (=~ S (7 nil) 0.7) (* (=~ S (6 nil) 0.7) (=~ Spower (8 nil) 0.3))))
                    (* (=~ losers (nil 3) 1) (=~ H (nil 4) 1) (=~ S (nil 4) 1)
                       (or (=~ second (5 nil) 0.7)
                           (=~ C (7 nil) 0.7) (* (=~ C (6 nil) 0.7) (=~ Cpower (8 nil) 0.3))
                           (=~ D (7 nil) 0.7) (* (=~ D (6 nil) 0.7) (=~ Dpower (8 nil) 0.3))))))))

((2 NT) . (* (=~ hcp (19 22) 0.5)
             (=~ C (2 5) 0.7) (=~ D (2 5) 0.7) (=~ H (2 4) 0.7) (=~ S (2 4) 0.7)))

((1 NT) . (* (=~ hcp (15 17) 0.5)
   (and (=~ C (3 4) 0.7) (=~ D (3 4) 0.7) 
        (=~ H (3 4) 0.7) (=~ S (3 4) 0.7)
        (=~ cstop (7 nil) 0.3) (=~ dstop (7 nil) 0.3)
        (=~ hstop (7 nil) 0.3) (=~ sstop (7 nil) 0.3))))

((1 S) . (* (=~ hcp (12 18) 0.35 ) (=~ S (5 nil) 0.7)
            (and (=~ losers (4 7) 1) (=~ spower (4 nil) 0.3))))

((1 H) . (* (=~ hcp (12 22) (0.35 0.5)) (=~ H (5 nil) 0.7) (=~ S (nil 4) 0.7)
            (and (=~ losers (5 5) 1) (=~ hpower (4 nil) 0.3))))

((1 D) . (* (=~ hcp (12 22) (0.35 0.5)) (=~ D (5 nil) 0.5) (=~ H (nil 4) 0.7) (=~ S (nil 4) 0.7)
            (and (=~ losers (4 7) 0.6) (=~ Dpower (4 nil) 0.2))))

((1 C) . (* (=~ hcp (12 22) (0.35 0.5)) (=~ C (5 nil) 0.2) (=~ H (nil 4) 0.7) (=~ S (nil 4) 0.7)
            (=~ losers (4 7) 0.6)))

((2 D) . (* (=~ hcp (6 10) 0.5) (=~ D 6 0.7)
            (and (=~ losers (8 nil) 0.6) (=~ Dpower (5 nil) 0.5))))

((2 H) . (* (=~ hcp (6 10) 0.5) (=~ H 6 0.7)
            (and (=~ losers (8 nil) 0.6) (=~ Hpower (5 nil) 0.5))))

((2 S) . (* (=~ hcp (6 10) 0.5) (=~ S 6 0.7)
            (and (=~ losers (8 nil) 0.6) (=~ Spower (5 nil) 0.5))))

((3 C) . (* (=~ hcp (6 10) 0.5) (=~ C (7 nil) 0.7) (=~ Cpower (5 nil) 0.5)))

((3 D) . (* (=~ hcp (6 10) 0.5) (=~ D (7 nil) 0.7) (=~ Dpower (5 nil) 0.5)))

((3 H) . (* (=~ hcp (6 10) 0.5) (=~ H (7 nil) 0.7) (=~ Hpower (5 nil) 0.5)))

((3 S) . (* (=~ hcp (6 10) 0.5) (=~ S (7 nil) 0.7) (=~ Spower (5 nil) 0.5)))

(nil . (* 0.7 (=~ hcp (0 10) 0.5)))
