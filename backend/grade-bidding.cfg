; Graded openings (grading.cl): one entry ((bid) . rule) per bid, nil for
; pass. The highest grade wins, the earlier bid on a tie. Grade expressions
; are described at the top of grading.cl. The debugger (grading.html) saves
; a rule edited there in place of its text here, keeping the rest of the file.
; Blurs: 0.5 a point for HCP and suit points, 0.7 a card for suit lengths.

((2 C) . (or (=~ hcp (23 nil) 0.5)
    (* (not balanced)
       (or (* (or (=~ H (5 nil) 1) (=~ S (5 nil) 1))
              (=~ losers (nil 4) 1))
           (* (or (=~ C (5 nil) 0.7) (=~ D (5 nil) 0.7))
              (=~ losers (nil 3) 1))))))

((2 NT) . (* (=~ hcp (19 22) 0.5)
             (and (=~ C (2 5) 0.7) (=~ D (2 5) 0.7) (=~ H (2 4) 0.7) (=~ S (2 4) 0.7))))

((1 NT) . (* (=~ hcp (15 17) 0.5)
             (and (=~ C (2 5) 0.7) (=~ D (2 5) 0.7) (=~ H (2 4) 0.7) (=~ S (2 4) 0.7))))

((1 S) . (* (=~ S (5 nil) 0.7)
            (and (=~ losers (5 7) 1) (=~ hcp (12 22) 0.5))
            (=~ spower (4 nil) 0.3)))

((1 H) . (* (=~ H (5 nil) 0.7)
            (and (=~ losers (5 5) 1) (=~ hcp (12 22) 0.5))
            (and (=~ hpower (4 nil) 0.3) (=~ S (nil 4) 0.7))))

((1 D) . (* (=~ D (5 nil) 0.5)
            (and (=~ losers (4 7) 0.6) (=~ hcp (12 22) 0.5))
            (and (=~ Dpower (4 nil) 0.2)
                 (=~ H (nil 4) 0.7) (=~ S (nil 4) 0.7))))

((1 C) . (* (=~ C (5 nil) 0.2)
            (and (=~ losers (4 7) 0.6) (=~ hcp (12 22) 0.5))
            (and (=~ H (nil 4) 0.7) (=~ S (nil 4) 0.7))))

((2 D) . (* (=~ D 6 0.7)
            (and (=~ losers (8 nil) 0.6) (=~ hcp (6 10) 0.5))
            (=~ Dpower (5 nil) 0.5)))

((2 H) . (* (=~ H 6 0.7)
            (and (=~ losers (8 nil) 0.6) (=~ hcp (6 10) 0.5))
            (=~ Hpower (5 nil) 0.5)))

((2 S) . (* (=~ S 6 0.7)
            (and (=~ losers (8 nil) 0.6) (=~ hcp (6 10) 0.5))
            (=~ Spower (5 nil) 0.5)))

((3 C) . (* (=~ C (7 nil) 0.7) (=~ hcp (6 10) 0.5) (=~ Cpower (5 nil) 0.5)))

((3 D) . (* (=~ D (7 nil) 0.7) (=~ hcp (6 10) 0.5) (=~ Dpower (5 nil) 0.5)))

((3 H) . (* (=~ H (7 nil) 0.7) (=~ hcp (6 10) 0.5) (=~ Hpower (5 nil) 0.5)))

((3 S) . (* (=~ S (7 nil) 0.7) (=~ hcp (6 10) 0.5) (=~ Spower (5 nil) 0.5)))

(nil . 1/2)
